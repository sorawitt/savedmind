services:
  db:
    image: pgvector/pgvector:pg17
    container_name: savedmind-db
    environment:
      POSTGRES_USER: savedmind
      POSTGRES_PASSWORD: savedmind_dev
      POSTGRES_DB: savedmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savedmind"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
