services:
  db:
    image: pgvector/pgvector:pg17
    container_name: savedmind-db
    environment:
      POSTGRES_USER: savedmind
      POSTGRES_PASSWORD: savedmind_dev
      POSTGRES_DB: savedmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U savedmind" ]
      interval: 5s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: savedmind-seq
    profiles: [ "logging" ] # Optional: run with --profile logging
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: savedmind-api
    ports:
      - "5050:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=db;Database=savedmind;Username=savedmind;Password=savedmind_dev"
      Seq__ServerUrl: "http://seq:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/src
    develop:
      watch:
        - action: rebuild
          path: ./backend

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: savedmind-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src

volumes:
  postgres_data:
  seq_data:
